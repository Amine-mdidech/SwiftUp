name: SwiftUp
options:
  bundleIdPrefix: com.swiftup
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
targets:
  SwiftUp:
    type: application
    platform: iOS
    sources:
      - path: SwiftUp
    info:
      path: Generated/SwiftUp-Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: SwiftUp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.815470112228-jp18qpb16m9eh1ktuamap25edg2qe3ja
        # TEST App ID (Google's published sample) — swap for your real AdMob App ID
        # once you register this app at https://apps.admob.com
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork   # Google's own network — functional minimum.
                                                              # Paste Google's full partner list here before a real launch:
                                                              # https://developers.google.com/admob/ios/choosing-networks
    entitlements:
      path: Generated/SwiftUp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftup.dailyquiz
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5K3Q8T2G5A
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleMobileAds
        product: GoogleMobileAds
  SwiftUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwiftUpTests
    dependencies:
      - target: SwiftUp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  SwiftUp:
    build:
      targets:
        SwiftUp: all
        SwiftUpTests: [test]
    test:
      targets:
        - SwiftUpTests
    run:
      config: Debug
